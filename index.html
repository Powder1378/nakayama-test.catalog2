<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>テスト</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="Nakayama_Icon.ico" />
</head>

<body>

  <!-- ────────────────
        固定ナビ（v0.app風）
  ───────────────── -->
  <nav class="top-nav">
    <h1 class="site-title">Nakayama Motors</h1>
    <div class="nav-links">
      <a href="index.html" class="nav-item active">🏠 ホイール</a>
      <a href="staff.html" class="nav-item">👥 スタッフ</a>
      <a href="horn.html" class="nav-item">🔊 クラクション</a>
    </div>
  </nav>

  <!-- 全体ラップ -->
  <div class="page-wrapper">

    <!-- ────────────────
          フィルターカード
    ───────────────── -->
    <section class="filter-card">

      <h2>絞り込み</h2>

      <div class="filter-grid">

        <!-- タイプ系フィルター -->
        <div class="filter-section">
          <h3>タイプ</h3>
          <div class="filter-list">
            <label><input type="checkbox" class="type-filter" value="Sports" checked> Sports</label>
            <label><input type="checkbox" class="type-filter" value="Muscle" checked> Muscle</label>
            <label><input type="checkbox" class="type-filter" value="SUV" checked> SUV</label>
            <label><input type="checkbox" class="type-filter" value="Lowrider" checked> Lowrider</label>
            <label><input type="checkbox" class="type-filter" value="Offroad" checked> Offroad</label>
            <label><input type="checkbox" class="type-filter" value="Benny's" checked> Benny's</label>
            <label><input type="checkbox" class="type-filter" value="Tuner" checked> Tuner</label>
            <label><input type="checkbox" class="type-filter" value="HighEnd" checked> High End</label>
            <label><input type="checkbox" class="type-filter" value="Bespoke" checked> Bespoke</label>
            <label><input type="checkbox" class="type-filter" value="Rally" checked> Rally</label>
            <label><input type="checkbox" class="type-filter" value="Dragster" checked> DragSter</label>
            <label><input type="checkbox" class="type-filter" value="Bike" checked> Bike</label>
          </div>

          <div class="filter-buttons">
            <button id="type-all-on">すべて選択</button>
            <button id="type-all-off">すべて解除</button>
          </div>
        </div>

        <!-- ソース -->
        <div class="filter-section">
          <h3>ソース</h3>
          <div class="filter-list">
            <label><input type="checkbox" class="source-filter" value="Vanilla" checked> Vanilla</label>
            <label><input type="checkbox" class="source-filter" value="MOD" checked> MOD</label>
          </div>
        </div>

        <!-- Chrome -->
        <div class="filter-section">
          <h3>クローム</h3>
          <div class="chrome-filter-buttons small-buttons">
            <label><input type="radio" name="chrome" value="All" checked> すべて</label>
            <label><input type="radio" name="chrome" value="True"> クロームあり</label>
          </div>
        </div>

        <!-- 検索 -->
        <div class="filter-section">
          <h3>検索</h3>
          <input type="text" id="search" placeholder="名前で検索">
        </div>

      </div>

      <p id="filter-summary" class="filter-summary">絞り込み結果：すべて表示</p>

    </section>

    <main>
      <div id="wheel-container" class="wheel-grid"></div>
    </main>

    <!-- チャットウィンドウ -->
    <div id="chat-window" class="chat-window">
      <div id="chat-content"></div>
    </div>

    <button id="scroll-to-top" class="scroll-to-top">⇪</button>

    <footer class="site-footer">
      <h2>お問い合わせ</h2>
      <p><strong>FlecityName:</strong> 粉末 ぱうだぁ</p>
      <p><strong>Form:</strong> <a href="https://forms.gle/HkCUNoGDMVmGTVwe9">お問い合わせフォーム</a></p>
      <p><strong>Address:</strong> 228 株式会社　中山モータース</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
